<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rifa con causa | Enviados</title>
  <meta name="description" content="Boletos de la rifa con causa de Enviados. Sorteo el 4 de diciembre de 2026.">
  <meta name="theme-color" content="#3E5C45">

  <link rel="icon" type="image/png" href="../assets/globo.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

  <!-- Tipografías del manual: Bebas Neue (títulos) y Montserrat (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="rifa.css">
</head>
<body>
  <main class="contenedor">

    <header class="encabezado">
      <h1>Rifa con <span>causa</span></h1>
      <img class="encabezado__logo" src="Enviados_Logo_RS.png" alt="Enviados" width="72" height="72">
    </header>

    <ul class="datos">
      <li><strong>$180 MXN</strong> por boleto</li>
      <li>Sorteo: <strong>4 dic 2026</strong></li>
    </ul>

    <!-- Los vendidos salen de la lista VENDIDOS en rifa.js -->
    <div class="cuadricula" id="cuadricula" aria-label="Boletos de la rifa"></div>

    <section class="premios" aria-label="Premios">
      <ol>
        <li><span class="premio__lugar">1°</span><span class="premio__nombre">AirPods Pro 3</span><span class="premio__valor">Valor $2,360</span></li>
        <li><span class="premio__lugar">2°</span><span class="premio__nombre">Bocina JBL</span><span class="premio__valor">Valor $1,563</span></li>
        <li><span class="premio__lugar">3°</span><span class="premio__nombre">Alexa Echo Pop</span><span class="premio__valor">Valor $850</span></li>
      </ol>
    </section>

  </main>

  <script src="rifa.js"></script>
</body>
</html>
